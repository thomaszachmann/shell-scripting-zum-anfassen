# notes-stack/compose.yaml – notes mit Postgres und nginx davor (Tag 0)
name: notes

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: lab-db-pw-123
      POSTGRES_DB: notes
    security_opt:
      - apparmor=unconfined            # Ubuntu 26.04: docker-default blockiert Postgres
    volumes:
      - notes-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: notes-api:0.4.0
    command: ["migrate"]
    environment: &api-env
      NOTES_API_KEY: lab-api-key-123
      NOTES_DB_URL: postgres://notes:lab-db-pw-123@db:5432/notes
    depends_on:
      db:
        condition: service_healthy

  notes-api:
    image: notes-api:0.4.0
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  proxy:
    image: nginx:1.31.8-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/notes
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - notes-api

volumes:
  notes-data:
