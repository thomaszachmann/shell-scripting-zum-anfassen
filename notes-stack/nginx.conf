# nginx.conf – Proxy vor notes-api, schreibt ein Zugriffslog ins Volume ./logs
log_format notes '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                 '$request_time $http_user_agent';

server {
  listen 80;
  access_log /var/log/notes/access.log notes;

  location / {
    proxy_pass http://notes-api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
